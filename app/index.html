         AdSense la voie toujours, même sans interagir avec la bannière cookies : charger la

         déposent, et ceux-là restent conditionnés à l'acceptation des cookies. -->

      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4527298741959726"
      crossorigin="anonymous"
    ></script>
